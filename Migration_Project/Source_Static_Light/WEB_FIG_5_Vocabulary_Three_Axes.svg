<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 420" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <marker id="vocabArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <filter id="shadow5" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="275" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">The Three Axes</text>
  <text x="275" y="46" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Three-dimensional semantic space</text>

  <!-- Central intersection -->
  <circle cx="275" cy="210" r="5" fill="#333"/>

  <!-- Vertical axis: USER -->
  <line x1="275" y1="205" x2="275" y2="80" stroke="#2E5090" stroke-width="2.5" marker-end="url(#vocabArrow)"/>
  <rect x="215" y="60" width="120" height="35" rx="6" fill="#e8f0fe" stroke="#2E5090" stroke-width="2" filter="url(#shadow5)"/>
  <text x="275" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E5090">USER</text>

  <!-- Left axis: SUBJECT -->
  <line x1="270" y1="213" x2="110" y2="320" stroke="#8B0000" stroke-width="2.5" marker-end="url(#vocabArrow)"/>
  <rect x="25" y="310" width="120" height="35" rx="6" fill="#fce8e8" stroke="#8B0000" stroke-width="2" filter="url(#shadow5)"/>
  <text x="85" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#8B0000">SUBJECT</text>

  <!-- Right axis: METHOD -->
  <line x1="280" y1="213" x2="440" y2="320" stroke="#2D6A2D" stroke-width="2.5" marker-end="url(#vocabArrow)"/>
  <rect x="400" y="310" width="120" height="35" rx="6" fill="#e8f5e8" stroke="#2D6A2D" stroke-width="2" filter="url(#shadow5)"/>
  <text x="460" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D6A2D">METHOD</text>

  <!-- Definitions -->
  <text x="400" y="80" font-size="10" fill="#2E5090">Who is asking, their expertise</text>
  <text x="400" y="94" font-size="10" fill="#2E5090">level, their intent.</text>

  <text x="25" y="362" font-size="10" fill="#8B0000">What is being discussed, its</text>
  <text x="25" y="376" font-size="10" fill="#8B0000">certainty level, its domain.</text>

  <text x="400" y="362" font-size="10" fill="#2D6A2D">How the claim was derived,</text>
  <text x="400" y="376" font-size="10" fill="#2D6A2D">what inference type, what</text>
  <text x="400" y="390" font-size="10" fill="#2D6A2D">confidence is warranted.</text>

  <!-- Bottom note -->
  <text x="275" y="412" text-anchor="middle" font-size="10" fill="#888" font-style="italic">Three-axis tracking: maintaining all three throughout processing.</text>
</svg>