<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <filter id="shadow6" x="-3%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">The Socratic Validator</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#666" font-style="italic">The system refuses to do the thinking. It demands the student complete the structure.</text>

  <!-- Student claim box -->
  <rect x="40" y="60" width="540" height="42" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#shadow6)"/>
  <text x="55" y="76" font-size="10" fill="#888" font-weight="bold">STUDENT CLAIM:</text>
  <text x="55" y="92" font-size="12" fill="#333" font-style="italic">"The French Revolution was caused by economic inequality."</text>

  <!-- Arrow -->
  <line x1="310" y1="102" x2="310" y2="125" stroke="#333" stroke-width="1.5"/>
  <polygon points="305,125 310,135 315,125" fill="#333"/>

  <!-- Analysis box -->
  <rect x="40" y="140" width="540" height="260" rx="8" fill="#fafaf5" stroke="#1a1a1a" stroke-width="2" filter="url(#shadow6)"/>
  <rect x="40" y="140" width="540" height="32" rx="8" fill="#2a2a2a"/>
  <rect x="40" y="162" width="540" height="10" fill="#2a2a2a"/>
  <text x="310" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">CLAIM ANALYSIS</text>

  <!-- 1. Referential - PASS -->
  <circle cx="68" cy="195" r="10" fill="#d4edda" stroke="#2D6A2D" stroke-width="1.5"/>
  <text x="68" y="199" text-anchor="middle" font-size="12" fill="#2D6A2D" font-weight="bold">&#x2713;</text>
  <text x="88" y="199" font-size="12" fill="#333"><tspan font-weight="bold" fill="#8B4513">Referential:</tspan> "French Revolution", "economic inequality" &#x2014; identified</text>

  <!-- 2. Contextual - WARNING -->
  <circle cx="68" cy="228" r="10" fill="#fff3cd" stroke="#B8860B" stroke-width="1.5"/>
  <text x="68" y="232" text-anchor="middle" font-size="12" fill="#B8860B" font-weight="bold">!</text>
  <text x="88" y="232" font-size="12" fill="#333"><tspan font-weight="bold" fill="#2E5090">Contextual:</tspan> Which period? 1789? The Terror? Thermidor?</text>

  <!-- 3. Premissive - FAIL -->
  <circle cx="68" cy="261" r="10" fill="#f8d7da" stroke="#8B0000" stroke-width="1.5"/>
  <text x="68" y="265" text-anchor="middle" font-size="12" fill="#8B0000" font-weight="bold">&#x2717;</text>
  <text x="88" y="265" font-size="12" fill="#333"><tspan font-weight="bold" fill="#2D6A2D">Premissive:</tspan> Missing evidence. What economic data supports this?</text>

  <!-- 4. Inferential - WARNING -->
  <circle cx="68" cy="294" r="10" fill="#fff3cd" stroke="#B8860B" stroke-width="1.5"/>
  <text x="68" y="298" text-anchor="middle" font-size="12" fill="#B8860B" font-weight="bold">!</text>
  <text x="88" y="298" font-size="12" fill="#333"><tspan font-weight="bold" fill="#8B0000">Inferential:</tspan> Correlation &#x2260; causation. What is the mechanism?</text>

  <!-- 5. Constraining - FAIL -->
  <circle cx="68" cy="327" r="10" fill="#f8d7da" stroke="#8B0000" stroke-width="1.5"/>
  <text x="68" y="331" text-anchor="middle" font-size="12" fill="#8B0000" font-weight="bold">&#x2717;</text>
  <text x="88" y="331" font-size="12" fill="#333"><tspan font-weight="bold" fill="#6B3FA0">Constraining:</tspan> Too broad. Was economic inequality the ONLY cause?</text>

  <!-- 6. Teleological - WARNING -->
  <circle cx="68" cy="360" r="10" fill="#fff3cd" stroke="#B8860B" stroke-width="1.5"/>
  <text x="68" y="364" text-anchor="middle" font-size="12" fill="#B8860B" font-weight="bold">!</text>
  <text x="88" y="364" font-size="12" fill="#333"><tspan font-weight="bold" fill="#B8860B">Teleological:</tspan> Thesis unclear. What argument are you making?</text>

  <!-- Result bar -->
  <rect x="40" y="388" width="540" height="12" rx="0" fill="#8B0000"/>

  <!-- Refusal box -->
  <rect x="60" y="415" width="500" height="40" rx="6" fill="#fff0f0" stroke="#8B0000" stroke-width="1.5"/>
  <text x="310" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#8B0000">SYSTEM REFUSAL TO CLOSE</text>
  <text x="310" y="448" text-anchor="middle" font-size="10" fill="#666">Claim incomplete. 2 failures, 3 warnings. Cannot validate.</text>

  <!-- Prompt box -->
  <rect x="40" y="468" width="540" height="42" rx="6" fill="#e8f0fe" stroke="#2E5090" stroke-width="1.5" filter="url(#shadow6)"/>
  <text x="55" y="484" font-size="10" fill="#2E5090" font-weight="bold">SYSTEM PROMPT TO STUDENT:</text>
  <text x="55" y="500" font-size="11" fill="#333">"You've identified a factor, but not a cause. What specific economic conditions?</text>
  <text x="55" y="514" font-size="11" fill="#333">And were they sufficient on their own?"</text>
</svg>