<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#333" stroke-width="1"/>
    </marker>
    <linearGradient id="vertexGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f6f0"/>
      <stop offset="100%" style="stop-color:#ede8d8"/>
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">The Geometry of Semantic Completeness</text>
  <text x="350" y="55" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Four components. Six constraints. The minimum structure for closure.</text>

  <!-- Tetrahedron edges (the SIX CONSTRAINTS) -->
  <!-- Edge: Claimant-Subject (Referential) -->
  <line x1="350" y1="105" x2="150" y2="390" stroke="#8B4513" stroke-width="2.5"/>
  <rect x="185" y="225" width="95" height="32" rx="4" fill="#fff8f0" stroke="#8B4513" stroke-width="1" filter="url(#shadow1)"/>
  <text x="232" y="237" text-anchor="middle" font-size="9" fill="#8B4513" font-weight="bold">REFERENTIAL</text>
  <text x="232" y="250" text-anchor="middle" font-size="8" fill="#8B4513">What is claimed?</text>

  <!-- Edge: Claimant-Grounds (Contextual) -->
  <line x1="350" y1="105" x2="550" y2="390" stroke="#2E5090" stroke-width="2.5"/>
  <rect x="420" y="225" width="90" height="32" rx="4" fill="#f0f4ff" stroke="#2E5090" stroke-width="1" filter="url(#shadow1)"/>
  <text x="465" y="237" text-anchor="middle" font-size="9" fill="#2E5090" font-weight="bold">CONTEXTUAL</text>
  <text x="465" y="250" text-anchor="middle" font-size="8" fill="#2E5090">Conditions?</text>

  <!-- Edge: Claimant-Purpose (Premissive) -->
  <line x1="350" y1="105" x2="350" y2="510" stroke="#2D6A2D" stroke-width="2.5"/>
  <rect x="355" y="285" width="85" height="32" rx="4" fill="#f0fff0" stroke="#2D6A2D" stroke-width="1" filter="url(#shadow1)"/>
  <text x="397" y="297" text-anchor="middle" font-size="9" fill="#2D6A2D" font-weight="bold">PREMISSIVE</text>
  <text x="397" y="310" text-anchor="middle" font-size="8" fill="#2D6A2D">On what grounds?</text>

  <!-- Edge: Subject-Grounds (Inferential) -->
  <line x1="150" y1="390" x2="550" y2="390" stroke="#8B0000" stroke-width="2.5"/>
  <rect x="302" y="395" width="95" height="32" rx="4" fill="#fff0f0" stroke="#8B0000" stroke-width="1" filter="url(#shadow1)"/>
  <text x="349" y="407" text-anchor="middle" font-size="9" fill="#8B0000" font-weight="bold">INFERENTIAL</text>
  <text x="349" y="420" text-anchor="middle" font-size="8" fill="#8B0000">Why does it follow?</text>

  <!-- Edge: Subject-Purpose (Constraining) -->
  <line x1="150" y1="390" x2="350" y2="510" stroke="#6B3FA0" stroke-width="2.5"/>
  <rect x="190" y="445" width="100" height="32" rx="4" fill="#f8f0ff" stroke="#6B3FA0" stroke-width="1" filter="url(#shadow1)"/>
  <text x="240" y="457" text-anchor="middle" font-size="9" fill="#6B3FA0" font-weight="bold">CONSTRAINING</text>
  <text x="240" y="470" text-anchor="middle" font-size="8" fill="#6B3FA0">What are the limits?</text>

  <!-- Edge: Grounds-Purpose (Teleological) -->
  <line x1="550" y1="390" x2="350" y2="510" stroke="#B8860B" stroke-width="2.5"/>
  <rect x="420" y="445" width="100" height="32" rx="4" fill="#fffcf0" stroke="#B8860B" stroke-width="1" filter="url(#shadow1)"/>
  <text x="470" y="457" text-anchor="middle" font-size="9" fill="#B8860B" font-weight="bold">TELEOLOGICAL</text>
  <text x="470" y="470" text-anchor="middle" font-size="8" fill="#B8860B">What is it for?</text>

  <!-- Vertices (the FOUR COMPONENTS) -->
  <!-- Top: Claimant -->
  <circle cx="350" cy="105" r="38" fill="url(#vertexGrad1)" stroke="#1a1a1a" stroke-width="2.5" filter="url(#shadow1)"/>
  <text x="350" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">CLAIMANT</text>
  <text x="350" y="115" text-anchor="middle" font-size="9" fill="#555">(Who asserts)</text>

  <!-- Bottom-left: Subject -->
  <circle cx="150" cy="390" r="38" fill="url(#vertexGrad1)" stroke="#1a1a1a" stroke-width="2.5" filter="url(#shadow1)"/>
  <text x="150" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">SUBJECT</text>
  <text x="150" y="400" text-anchor="middle" font-size="9" fill="#555">(What is discussed)</text>

  <!-- Bottom-right: Grounds -->
  <circle cx="550" cy="390" r="38" fill="url(#vertexGrad1)" stroke="#1a1a1a" stroke-width="2.5" filter="url(#shadow1)"/>
  <text x="550" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">GROUNDS</text>
  <text x="550" y="400" text-anchor="middle" font-size="9" fill="#555">(What supports it)</text>

  <!-- Bottom-center: Purpose -->
  <circle cx="350" cy="510" r="38" fill="url(#vertexGrad1)" stroke="#1a1a1a" stroke-width="2.5" filter="url(#shadow1)"/>
  <text x="350" y="506" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">PURPOSE</text>
  <text x="350" y="520" text-anchor="middle" font-size="9" fill="#555">(What it is for)</text>

  <!-- Bottom annotation -->
  <text x="350" y="575" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="bold">4 vertices = components.  6 edges = constraints.</text>
  <text x="350" y="593" text-anchor="middle" font-size="11" fill="#666">Remove any edge and the structure collapses. Meaning leaks out.</text>
  <text x="350" y="611" text-anchor="middle" font-size="10" fill="#888" font-style="italic">The simplest closed three-dimensional structure. Discovered 2,400 years ago. Recovered here.</text>
</svg>