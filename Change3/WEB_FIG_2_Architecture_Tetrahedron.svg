<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <linearGradient id="vertexGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f6f0"/>
      <stop offset="100%" style="stop-color:#ede8d8"/>
    </linearGradient>
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c41e3a"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Why Six?</text>
  <text x="350" y="52" text-anchor="middle" font-size="12" fill="#666" font-style="italic">The tetrahedron: simplest three-dimensional enclosure</text>

  <!-- Main tetrahedron structure -->
  <!-- Edges first (behind vertices) -->
  <!-- 1. Claimant ↔ Subject: REFERENTIAL -->
  <line x1="350" y1="120" x2="140" y2="380" stroke="#8B4513" stroke-width="3"/>
  <!-- 2. Claimant ↔ Grounds: CONTEXTUAL -->
  <line x1="350" y1="120" x2="560" y2="380" stroke="#2E5090" stroke-width="3"/>
  <!-- 3. Claimant ↔ Purpose: PREMISSIVE -->
  <line x1="350" y1="120" x2="350" y2="500" stroke="#2D6A2D" stroke-width="3"/>
  <!-- 4. Subject ↔ Grounds: INFERENTIAL -->
  <line x1="140" y1="380" x2="560" y2="380" stroke="#8B0000" stroke-width="3"/>
  <!-- 5. Subject ↔ Purpose: CONSTRAINING -->
  <line x1="140" y1="380" x2="350" y2="500" stroke="#6B3FA0" stroke-width="3"/>
  <!-- 6. Grounds ↔ Purpose: TELEOLOGICAL -->
  <line x1="560" y1="380" x2="350" y2="500" stroke="#B8860B" stroke-width="3"/>

  <!-- Edge labels with constraint names -->
  <!-- 1. Referential -->
  <rect x="178" y="228" width="100" height="22" rx="3" fill="#fff8f0" stroke="#8B4513" stroke-width="1" opacity="0.95"/>
  <text x="228" y="243" text-anchor="middle" font-size="10" fill="#8B4513" font-weight="bold">1. Referential</text>

  <!-- 2. Contextual -->
  <rect x="422" y="228" width="95" height="22" rx="3" fill="#f0f4ff" stroke="#2E5090" stroke-width="1" opacity="0.95"/>
  <text x="469" y="243" text-anchor="middle" font-size="10" fill="#2E5090" font-weight="bold">2. Contextual</text>

  <!-- 3. Premissive -->
  <rect x="355" y="295" width="90" height="22" rx="3" fill="#f0fff0" stroke="#2D6A2D" stroke-width="1" opacity="0.95"/>
  <text x="400" y="310" text-anchor="middle" font-size="10" fill="#2D6A2D" font-weight="bold">3. Premissive</text>

  <!-- 4. Inferential -->
  <rect x="300" y="385" width="100" height="22" rx="3" fill="#fff0f0" stroke="#8B0000" stroke-width="1" opacity="0.95"/>
  <text x="350" y="400" text-anchor="middle" font-size="10" fill="#8B0000" font-weight="bold">4. Inferential</text>

  <!-- 5. Constraining -->
  <rect x="180" y="438" width="105" height="22" rx="3" fill="#f8f0ff" stroke="#6B3FA0" stroke-width="1" opacity="0.95"/>
  <text x="232" y="453" text-anchor="middle" font-size="10" fill="#6B3FA0" font-weight="bold">5. Constraining</text>

  <!-- 6. Teleological -->
  <rect x="420" y="438" width="105" height="22" rx="3" fill="#fffcf0" stroke="#B8860B" stroke-width="1" opacity="0.95"/>
  <text x="472" y="453" text-anchor="middle" font-size="10" fill="#B8860B" font-weight="bold">6. Teleological</text>

  <!-- Vertices -->
  <!-- Top: Claimant -->
  <circle cx="350" cy="120" r="40" fill="url(#vertexGrad2)" stroke="#1a1a1a" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="350" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Claimant</text>
  <text x="350" y="130" text-anchor="middle" font-size="9" fill="#555">(who asserts)</text>

  <!-- Bottom-left: Subject -->
  <circle cx="140" cy="380" r="40" fill="url(#vertexGrad2)" stroke="#1a1a1a" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="140" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Subject</text>
  <text x="140" y="390" text-anchor="middle" font-size="9" fill="#555">(what is discussed)</text>

  <!-- Bottom-right: Grounds -->
  <circle cx="560" cy="380" r="40" fill="url(#vertexGrad2)" stroke="#1a1a1a" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="560" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Grounds</text>
  <text x="560" y="390" text-anchor="middle" font-size="9" fill="#555">(what supports it)</text>

  <!-- Bottom-center: Purpose -->
  <circle cx="350" cy="500" r="40" fill="url(#vertexGrad2)" stroke="#1a1a1a" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="350" y="496" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Purpose</text>
  <text x="350" y="510" text-anchor="middle" font-size="9" fill="#555">(what it is for)</text>

  <!-- Legend -->
  <rect x="50" y="560" width="600" height="75" rx="6" fill="#fafaf5" stroke="#ccc" stroke-width="1"/>
  <circle cx="80" cy="580" r="8" fill="url(#vertexGrad2)" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="95" y="584" font-size="11" fill="#333">= Component (vertex)</text>
  <line x1="65" y1="605" x2="95" y2="605" stroke="#8B0000" stroke-width="3"/>
  <text x="105" y="609" font-size="11" fill="#333">= Constraint (edge) — the relation between components</text>
  <text x="350" y="630" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="bold">Remove any edge → structure collapses → no enclosure → meaning leaks out</text>
</svg>